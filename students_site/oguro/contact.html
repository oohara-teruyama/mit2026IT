<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta_charset="UTF-8">
        <title>フラワーアレジメント教室 Bloom</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" >
        <link rel="stylesheet" href="css/style.css">
    </head>
<body>
    <!--ヘッダー-->
    <header>
        <h1><a href="index.html"><img src="images (1)/images/logo.png"  alt="フラワーアレジメント教室ブルーム"></a></h1>
        <div id="header_contact"><a href="contact.html"></a><img src="images/btn_contact.jpg" alt="お問い合わせ"></a></div>
        <nav id="global_navi">
            <ul>
                <li ><a href="index.html">HOME</a></li>
                <li><a href="course.html">講座案内</a></li>
                <li><a href="gallery.html">ギャラリー</a></li>
                <li><a href="accese.html">アクセス</a></li>
                <li class="current"><a href="contact.html">お問い合わせ</a></li>
            </ul>
          </nav>
    </header>
    <!--/ヘッダー-->
    <!--wrapper-->
    <div id="wrapper">
        <!--メイン-->
        <div id="main">
            <div id="breadcrumb">
                <ol>
                    <li><a href="index.html">HOME</a></li>
                    <li>お問い合わせ</li>
                </ol>
            </div>
            <article>
                
                <section>
                    <h2>お問い合わせフォーム</h2>
                    <form id="entry">
                        <dl>
                            <dt>お名前 <span class="must">※</span></dt>
                            <dd><input type="text" name="name" id="name" required></dd>
                            <dt>メールアドレス <span class="must">※</span></dt>
                            <dd><input type="email" name="email" id="email" required></dd>
                            <dt>興味のある講座</dt>
                            <dd>
                                <select name="interest" id="interest">
                                   <option value="1day体験教室">1day体験教室</option>
                                   <option value="ブライダル・アートフラワー教室">ブライダル・アートフラワー教室</option>
                                   <option value="資格所得講座">資格所得講座</option>
                                </select>
                            </dd>
                            <dt>お問い合わせ種別</dt>
                            <dd>
                                <label><input type="checkbox"  id="category1" value="講座申し込み">講座申し込み</label>
                                <label><input type="checkbox"  id="category2" value="資料請求">資料請求</label>
                                <label><input type="checkbox"  id="category3" value="その他のお問い合わせ">その他のお問い合わせ</label>    
                            </dd>
                            <dt>Bloomを知ったきっかけ</dt>
                            <dd>
                                <label><input type="radio"  id="questionnaire1" value="口コミ">口コミ</label>
                                <label><input type="radio"  id="questionnaire2" value="検索エンジンから">検索エンジンから</label>
                                <label><input type="radio"  id="questionnaire3" value="その他">その他</label>
                            </dd>
                            <dt>お問い合わせ内容</dt>
                            <dd><textarea name="detail" id="detail"></textarea>
                            </dd>
                        </dl>
                        <p id="submit_button_cover">
                            <input type="submit" id="submit_button" value="送信する">
                        </p>
                    </form>
                </section>
            </article>
        </div>
        <!--/メイン-->

        <!--サイド-->
        <aside id="sidebar">
            <section id="side_banner">
                <h2>関連リンク</h2>
                <ul>
                    <li><a href="#" target="_blank"><img src="images (1)/images/banner01.jpg" alt="ブルームブログ"></a></li>
                    <li><a href="https:/www.facebook.com/" target="_blank"><img src="images (1)/images/banner02.jpg" alt="イイネ!押してね!facebookページ"></a></li>                    
                </ul>
            </section>
            <section id="side_contact">
                <h2>ご予約・お問い合わせ</h2>
                <address><img src="images (1)/images/mark_tel.png" alt="TEL">052-232-8229</address>
                <p>受付時間 9:00~18:00</p>
                <p><a href="contact.html" class="contact_button">お問い合わせフォーム</a></p>
            </section>
        </aside>
        <!--/サイド-->
    </div>
    <!--/wrapper-->
   <!--フッター-->
    <footer>
        <div id="footer_nav">
            <ul>
                <li><a href="index.html">HOME</a></li>
                <li><a href="course.html">講座案内</a></li>
                <li><a href="gallery.html">ギャラリー</a></li>
                <li><a href="access.html">アクセス</a></li>
                <li><a href="contact.html">お問い合わせ</a></li>
                <li><a href="policy.html">プライバシーポリシー</a></li>
            </ul>
        </div>
        <small>&copy; 2015 Bloom</small>
    </footer>
    <!--/フッター-->
</body>
</html>
