                            <dt>お名前 <span class="must">※</span></dt>
                            <dd><input type="text" name="name" id="name" recuired></dd>

                            <dd><input type="email" name="email" id="email" recuired></dd>
                            <dt>お問い合わせ種別 </dt>
                            <dd>
                                <select name="interest" id="interest">
                                 <option value="内容不備">内容不備</option>   
                                 <option value="感想">感想</option>
                                 <option value="その他">その他</option>   
                                </select>
                            </dd>
                            <dt>お問い合わせ内容 </dt>
                            <dd>
                                <textarea name="detail" id="detail"></textarea>
                            </dd>
                        </dl>
                        <p id="submit_button_cover"> 
                            <input type="submit" id="submit_button" value="送信する">
                        </p>
                    </form>
               </section>
