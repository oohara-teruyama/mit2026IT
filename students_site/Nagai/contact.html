        <meta charset="UTF-8">
        <title>
            QUESTION｜自己紹介</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <!--ヘッダー-->
        <header>
            <h1 id="title">
                自己紹介</h1>
            <nav id="global_navi">
                <ul>
                    <li><a href="index.html">
                        HOME</a></li>
                    <li><a href="course.html">
                        GAME</a></li>
                    <li><a href="gallery.html">
                        CHARACTER</a></li>
                    <li><a href="access.html">
                        ACCESS</a></li>
                    <li class="current"><a href="contact.html">
                        QUESTION</a></li>
                </ul>  
            </nav>  
        </header>

        <!--wrapper-->
        <div id="wrapper">
            <!--メイン-->
            <div id="main">
                <div id="breadcrumb">
                    <ol>
                        <li><a href=index.html>
                            HOME</a></li>
                        <li>
                            QUESTION</li>
                    </ol>
                </div>
                <article>
                    <section>
                        <h2>
                            質問</h2>
                        <p>
                            なにかご質問があればこちらにどうぞ</p>
                        <form id="entry">
                            <dl>
                                <dt>
                                    お名前</dt>
                                <dd>
                                    <input type="text" name="name" id="name" required></dd>
                                <dt>
                                    メールアドレス <span class="must">※</span></dt>
                                <dd>
                                    <input type="email" name="email" id="email" required></dd>
                                
                                <dt>
                                    質問種別</dt>
                                <dd>
                                    <label>
                                        <input type="radio" name="questionnaire" id="questionnaire1" value="文句">文句</label>
                                    <label>
                                        <input type="radio" name="questionnaire" id="questionnaire2" value="アンチ">アンチ</label>
                                    <label>
                                        <input type="radio" name="questionnaire" id="questionnaire3" value="暴言">暴言</label>
                                </dd>
                                <dt>
                                    質問内容</dt>
                                <dd>
                                    <textarea name="detail" id="detail"></textarea>
                                </dd>
                            </dl>
                            <p id="submit_button_cover">
                                <input type="submit" id="submit_button" value="送信する"></p>
                        </form>
                    </section>
                </article>
            </div>
        </div>

            <div id="footer_nav">

            </div>

        </footer>
    </body>
